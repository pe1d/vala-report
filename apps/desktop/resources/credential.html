<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Vala Desktop</title>
  <link rel="stylesheet" href="../dist/renderer/ui.css" />
</head>
<!-- Hộp nhập tài khoản / mật khẩu một hệ thống nguồn (credential-window.ts). Chữ do tiến trình chính gửi theo ngôn ngữ. -->
<body class="bg-white text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <form id="f" class="grid gap-3 p-5">
    <h1 id="title" class="text-base font-semibold"></h1>
    <p id="hint" class="text-xs text-slate-600 dark:text-slate-400"></p>
    <label class="grid gap-1 text-sm"><span id="l-user"></span>
      <input id="user" type="text" autocomplete="off" spellcheck="false" required
        class="rounded-md border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900" /></label>
    <label class="grid gap-1 text-sm"><span id="l-pass"></span>
      <input id="pass" type="password" autocomplete="off" required
        class="rounded-md border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900" /></label>
    <p id="err" class="text-sm text-red-700 dark:text-red-400" role="alert"></p>
    <div class="flex justify-end gap-2">
      <button type="button" id="cancel" class="rounded-md border border-slate-300 px-3 py-2 text-sm dark:border-slate-700"></button>
      <button type="submit" id="save" class="rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-300"></button>
    </div>
  </form>
  <script src="../dist/renderer/credential.js"></script>
</body>
</html>
