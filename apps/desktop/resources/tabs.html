<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:" />
  <title>Vala Desktop</title>
  <link rel="stylesheet" href="../dist/renderer/ui.css" />
</head>
<!-- Chỉ có thanh tab, không có ô địa chỉ / nút điều hướng. Chiều cao phải khớp TOOLBAR_H trong src/browser.ts (40px). -->
<body class="h-[40px] select-none overflow-hidden bg-slate-200 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div class="flex h-[40px] items-end gap-2 border-b border-slate-300 px-2 pt-1 dark:border-slate-800">
    <div id="tabs" class="flex min-w-0 flex-1 items-end gap-1 overflow-x-auto [scrollbar-width:none]" role="tablist"></div>
    <div class="mb-1 flex shrink-0 items-center gap-1">
      <span id="dev" title="Vala Desktop (dev)" class="mr-1 rounded bg-orange-500 px-1.5 py-0.5 text-[11px] font-bold tracking-wide text-white">DEV</span>
      <button type="button" id="update" class="mr-1 rounded-full bg-blue-600 px-3 py-0.5 text-xs font-medium text-white hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-400"></button>
      <div class="flex overflow-hidden rounded-md border border-slate-300 text-xs dark:border-slate-700">
        <button type="button" data-lang="vi" class="px-2 py-0.5 aria-pressed:bg-slate-900 aria-pressed:text-white dark:aria-pressed:bg-slate-100 dark:aria-pressed:text-slate-900">VI</button>
        <button type="button" data-lang="en" class="px-2 py-0.5 aria-pressed:bg-slate-900 aria-pressed:text-white dark:aria-pressed:bg-slate-100 dark:aria-pressed:text-slate-900">EN</button>
      </div>
      <button type="button" id="theme" class="flex h-7 w-7 items-center justify-center rounded-md text-slate-700 hover:bg-slate-300 dark:text-slate-200 dark:hover:bg-slate-800">
        <!-- Đang sáng ⇒ mặt trăng (bấm sang tối); đang tối ⇒ mặt trời. -->
        <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg class="hidden h-4 w-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
      <button type="button" id="menu" class="flex h-7 w-7 items-center justify-center rounded-md text-lg text-slate-700 hover:bg-slate-300 dark:text-slate-200 dark:hover:bg-slate-800">⋯</button>
      <!-- Hồ sơ: chưa đăng nhập ⇒ nút "Đăng nhập"; đã đăng nhập ⇒ chữ cái đầu + tên, bấm ra menu (Cài đặt, Đăng xuất…). -->
      <button type="button" id="sign-in" class="ml-1 rounded-md bg-blue-600 px-3 py-1 text-xs font-medium text-white hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-400"></button>
      <button type="button" id="profile" class="ml-1 flex h-7 max-w-[200px] items-center gap-1.5 rounded-full py-0.5 pl-0.5 pr-2 text-[13px] text-slate-700 hover:bg-slate-300 dark:text-slate-200 dark:hover:bg-slate-800">
        <span id="avatar" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-blue-600 text-[10px] font-semibold text-white dark:bg-blue-500"></span>
        <span id="profile-name" class="min-w-0 truncate"></span>
        <span aria-hidden="true" class="text-[10px] text-slate-500 dark:text-slate-400">▾</span>
      </button>
    </div>
  </div>
  <script src="../dist/renderer/tabs.js"></script>
</body>
</html>
