<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:" />
  <title>Vala Desktop</title>
  <link rel="stylesheet" href="../dist/renderer/ui.css" />
</head>
<!--
  Cửa sổ không viền (browser.ts): HEADER cao 44px chạy hết chiều ngang (HEADER_H) — thu gọn thanh bên, logo, ◀ ▶ ⟳, ô tìm
  kiếm Ctrl+K (giữa), nút cửa sổ ─ □ ✕; kéo header để di chuyển cửa sổ. Bên dưới: THANH ỨNG DỤNG DỌC (248 / 52px — SIDEBAR_W
  / SIDEBAR_MIN_W) và khung bo góc #card nơi trang web nằm (cách mép phải/dưới 8px — GAP). Không có ô địa chỉ. Chữ hiển thị
  do tiến trình chính gửi; mục danh sách dựng bằng JS (renderer/tabs.ts).
-->
<body class="flex h-screen select-none flex-col overflow-hidden bg-slate-100 text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-200">
  <header id="header" class="drag grid h-11 shrink-0 grid-cols-[minmax(max-content,1fr)_minmax(160px,520px)_minmax(max-content,1fr)] items-center gap-3 pl-3 pr-1.5">
    <div class="flex items-center gap-0.5">
      <button type="button" id="collapse" class="side-btn no-drag"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M9 4v16" /></svg></button>
      <span id="brand" class="flex items-center gap-1.5 px-1.5 text-[14px] font-semibold tracking-tight">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] text-orange-500" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.1L20.5 10l-6.1 2.4L12 18.5l-2.4-6.1L3.5 10l6.1-1.9z" /><path d="M19 15l1 2.5 2.5 1-2.5 1L19 22l-1-2.5-2.5-1 2.5-1z" /></svg>
        <span>Vala</span>
        <span id="dev-badge" class="rounded-full bg-orange-100 px-1.5 py-px text-[10px] font-semibold text-orange-700 dark:bg-orange-950 dark:text-orange-300">DEV</span>
      </span>
      <span id="nav-sep" class="mx-1.5 h-4 w-px bg-slate-300 dark:bg-slate-700"></span>
      <button type="button" id="back" class="side-btn no-drag"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg></button>
      <button type="button" id="forward" class="side-btn no-drag"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6" /></svg></button>
      <button type="button" id="reload" class="side-btn no-drag"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4" /><path d="M21 3v6h-6" /></svg></button>
    </div>
    <button type="button" id="search" class="no-drag flex h-8 w-full min-w-0 items-center gap-2 rounded-full border border-slate-200 bg-white px-3 text-[13px] text-slate-500 shadow-sm hover:border-slate-300 hover:text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400 dark:hover:border-slate-600 dark:hover:text-slate-200">
      <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
      <span id="search-text" class="min-w-0 flex-1 truncate text-left"></span>
      <kbd class="shrink-0 rounded-md border border-slate-200 bg-slate-50 px-1.5 font-sans text-[11px] text-slate-500 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-300">Ctrl K</kbd>
    </button>
    <div class="flex items-center justify-end gap-0.5">
      <button type="button" id="win-min" class="win-btn no-drag"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
      <button type="button" id="win-max" class="win-btn no-drag"><svg id="win-max-icon" viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" /></svg><svg id="win-restore-icon" viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="12" height="12" rx="2.5" /><path d="M8 8V6.5A2.5 2.5 0 0 1 10.5 4H17.5A2.5 2.5 0 0 1 20 6.5V13.5A2.5 2.5 0 0 1 17.5 16H16" /></svg></button>
      <button type="button" id="win-close" class="win-btn win-close no-drag"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18" /><path d="M6 6l12 12" /></svg></button>
    </div>
  </header>
  <div class="flex min-h-0 flex-1">
  <div id="bar" class="flex h-full w-[248px] shrink-0 flex-col">
    <div id="chat-slot" class="px-2 pt-1"></div>
    <nav id="scroll" class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-2 pb-2 [scrollbar-width:thin]">
      <div id="apps-title" class="side-sec"></div>
      <div id="apps" class="space-y-0.5" role="tablist"></div>
      <div id="open-title" class="side-sec"></div>
      <div id="open" class="space-y-0.5" role="tablist"></div>
    </nav>
    <div id="bottom" class="space-y-1 px-2 pb-2 pt-1">
      <button type="button" id="update" class="w-full truncate rounded-md bg-blue-600 px-2 py-1.5 text-xs font-medium text-white hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-400"></button>
      <div id="me" class="flex items-center gap-1">
        <button type="button" id="profile" class="flex h-12 min-w-0 flex-1 items-center gap-2 rounded-lg px-1 py-1.5 text-left hover:bg-slate-200 dark:hover:bg-slate-800">
          <span id="avatar" class="relative flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-blue-600 text-[11px] font-semibold text-white dark:bg-blue-500"></span>
          <span id="profile-text" class="min-w-0 flex-1">
            <span id="profile-name" class="block truncate text-[13px] font-medium"></span>
            <span id="profile-sub" class="block truncate text-[11px] text-slate-500 dark:text-slate-400"></span>
          </span>
          <svg id="profile-chev" viewBox="0 0 24 24" class="h-4 w-4 shrink-0 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <button type="button" id="sign-in" class="min-w-0 flex-1 truncate rounded-md bg-blue-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-400"></button>
        <button type="button" id="apps-grid" class="side-btn"><svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.2" /><rect x="14" y="4" width="6" height="6" rx="1.2" /><rect x="4" y="14" width="6" height="6" rx="1.2" /><rect x="14" y="14" width="6" height="6" rx="1.2" /></svg></button>
      </div>
    </div>
  </div>
  <!-- Nền khung trang web (trang web đè lên đúng chỗ này) — thấy được khi trang chưa vẽ xong. -->
  <div id="card" class="mb-2 mr-2 min-w-0 flex-1 rounded-[12px] bg-white dark:bg-slate-950"></div>
  </div>
  <script src="../dist/renderer/tabs.js"></script>
</body>
</html>
