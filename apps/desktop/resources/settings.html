<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Cài đặt</title>
  <link rel="stylesheet" href="../dist/renderer/ui.css" />
</head>
<!-- Tab Cài đặt (settings-page.ts). Chữ hiển thị do tiến trình chính gửi (data-t). -->
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div class="flex min-h-screen">
    <nav class="w-56 shrink-0 border-r border-slate-200 bg-white px-3 py-5 dark:border-slate-800 dark:bg-slate-900">
      <div class="mb-4 flex items-center gap-2 px-2">
        <img src="icon.png" alt="" class="h-7 w-7 rounded" />
        <h1 class="text-base font-semibold" data-t="title"></h1>
      </div>
      <ul class="space-y-1 text-sm">
        <li><button type="button" data-section="tai-khoan" data-t="navAccount" class="nav-item"></button></li>
        <li><button type="button" data-section="mat-khau" data-t="navPasswords" class="nav-item"></button></li>
        <li><button type="button" data-section="giao-dien" data-t="navAppearance" class="nav-item"></button></li>
        <li><button type="button" data-section="khoi-dong" data-t="navStartup" class="nav-item"></button></li>
        <li><button type="button" data-section="gioi-thieu" data-t="navAbout" class="nav-item"></button></li>
        <li id="nav-home" hidden><button type="button" data-section="trang-chinh" data-t="navHome" class="nav-item"></button></li>
      </ul>
    </nav>

    <main class="min-w-0 flex-1 px-8 py-6">
      <div class="mx-auto max-w-3xl">
        <section data-panel="tai-khoan">
          <h2 class="panel-title" data-t="navAccount"></h2>
          <div class="card">
            <p class="muted" data-t="accountHint"></p>
            <div id="signed-in" class="mt-4" hidden>
              <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-sm">
                <dt class="muted" data-t="signedInAs"></dt><dd id="user-name" class="break-all"></dd>
                <dt class="muted" data-t="serverIs"></dt><dd id="user-server" class="break-all"></dd>
              </dl>
              <div class="mt-4 flex gap-2">
                <button type="button" id="open-portal" class="btn-primary" data-t="openPortal"></button>
                <button type="button" id="logout" class="btn-danger" data-t="logout"></button>
              </div>
            </div>
            <div id="signed-out" class="mt-4" hidden>
              <p class="text-sm" data-t="notSignedIn"></p>
              <button type="button" id="sign-in" class="btn-primary mt-3" data-t="signIn"></button>
            </div>
          </div>
        </section>

        <section data-panel="mat-khau">
          <h2 class="panel-title" data-t="navPasswords"></h2>
          <div class="space-y-4">
            <div class="card">
              <p class="muted" data-t="pwHint"></p>
              <p id="pw-unavailable" class="mt-3 text-sm text-red-700 dark:text-red-400" data-t="pwUnavailable" hidden></p>
            </div>
            <div class="card">
              <h3 class="text-sm font-semibold" data-t="pwSources"></h3>
              <p id="pw-sources-empty" class="muted mt-2" data-t="pwSourcesSignedOut" hidden></p>
              <ul id="pw-sources" class="pw-list"></ul>
            </div>
            <div class="card">
              <h3 class="text-sm font-semibold" data-t="pwSites"></h3>
              <p id="pw-sites-empty" class="muted mt-2" data-t="pwNoSites" hidden></p>
              <ul id="pw-sites" class="pw-list"></ul>
            </div>
            <div id="pw-never-card" class="card" hidden>
              <h3 class="text-sm font-semibold" data-t="pwNever"></h3>
              <ul id="pw-never" class="pw-list"></ul>
            </div>
          </div>
        </section>

        <section data-panel="giao-dien">
          <h2 class="panel-title" data-t="navAppearance"></h2>
          <div class="card space-y-5">
            <div>
              <div class="text-sm font-medium" data-t="langLabel"></div>
              <div class="mt-2 inline-flex overflow-hidden rounded-md border border-slate-300 text-sm dark:border-slate-700">
                <button type="button" data-lang="vi" class="seg">Tiếng Việt</button>
                <button type="button" data-lang="en" class="seg">English</button>
              </div>
            </div>
            <div>
              <div class="text-sm font-medium" data-t="themeLabel"></div>
              <div class="mt-2 inline-flex overflow-hidden rounded-md border border-slate-300 text-sm dark:border-slate-700">
                <button type="button" data-theme="light" class="seg" data-t="themeLight"></button>
                <button type="button" data-theme="dark" class="seg" data-t="themeDark"></button>
                <button type="button" data-theme="system" class="seg" data-t="themeSystem"></button>
              </div>
            </div>
          </div>
        </section>

        <section data-panel="khoi-dong">
          <h2 class="panel-title" data-t="navStartup"></h2>
          <div class="card">
            <label class="flex items-start gap-3 text-sm">
              <input id="autostart" type="checkbox" class="mt-0.5" />
              <span><span class="font-medium" data-t="autostartLabel"></span><br /><span class="muted" data-t="autostartHint"></span></span>
            </label>
            <p id="autostart-dev" class="muted mt-3" data-t="autostartDev" hidden></p>
          </div>
        </section>

        <section data-panel="gioi-thieu">
          <h2 class="panel-title" data-t="navAbout"></h2>
          <div class="card">
            <div class="flex items-center gap-3">
              <img src="icon.png" alt="" class="h-10 w-10 rounded" />
              <div><div class="font-semibold">Vala Desktop</div><div class="muted"><span data-t="aboutVersion"></span> <span id="version"></span></div></div>
            </div>
            <p id="update-hint" class="muted mt-4"></p>
            <div class="mt-3 flex gap-2">
              <button type="button" id="check-update" class="btn" data-t="checkUpdate"></button>
              <button type="button" id="install-update" class="btn-primary" hidden></button>
            </div>
          </div>
          <div id="whats-new-pending" class="card mt-4" hidden>
            <h3 id="whats-new-pending-title" class="text-sm font-semibold"></h3>
            <ul id="whats-new-pending-list" class="whats-new"></ul>
          </div>
          <div id="whats-new-current" class="card mt-4" hidden>
            <h3 class="text-sm font-semibold" data-t="whatsNewCurrent"></h3>
            <ul id="whats-new-current-list" class="whats-new"></ul>
          </div>
        </section>

        <section data-panel="trang-chinh">
          <h2 class="panel-title" data-t="navHome"></h2>
          <form id="home-form" class="card">
            <p class="muted" data-t="homeHint"></p>
            <label for="home" class="mt-3 block text-sm font-medium" data-t="homeLabel"></label>
            <div class="mt-1 flex gap-2">
              <input id="home" type="url" required spellcheck="false" class="input min-w-0 flex-1" />
              <button type="submit" class="btn-primary" data-t="homeSave"></button>
            </div>
            <button type="button" id="home-reset" class="mt-2 text-sm text-blue-700 underline-offset-2 hover:underline dark:text-blue-400" data-t="homeUseServer"></button>
            <p id="home-note" class="mt-2 text-sm" role="status"></p>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="../dist/renderer/settings.js"></script>
</body>
</html>
