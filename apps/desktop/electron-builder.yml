# Đóng gói Vala Desktop. Trang chính / máy chủ mặc định theo nơi triển khai đặt lúc build:
#   VALA_HOME_URL=https://vala.donvi.gov.vn/ VALA_URL=https://baocao.donvi.gov.vn pnpm package
appId: com.bkav.vala.desktop
productName: Vala Desktop
artifactName: vala-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
# Không có dependency chạy (chỉ devDependencies) ⇒ không cần rebuild module native; bước này còn lỗi với node_modules của pnpm.
npmRebuild: false
files:
  - dist/**/*
  - resources/settings.html
  - resources/recording.html
  - resources/chat.html
  - resources/overlay.html
  - resources/credential.html
  - resources/tabs.html
  - resources/icon.png
  - package.json
# Sinh latest.yml (phiên bản + sha512 của file cài) cho tự cập nhật. Địa chỉ ở đây chỉ để electron-builder ghi vào gói —
# ứng dụng luôn hỏi <máy chủ Vala Reporting trong Cài đặt>/desktop/ (src/updater.ts). Không tự tải lên đâu (-p never).
# Điểm mới của bản này (scripts/release-notes.cjs tách từ CHANGELOG.md) ⇒ trường releaseNotes của latest.yml.
releaseInfo:
  releaseNotesFile: dist/release-notes.json
publish:
  - provider: generic
    url: https://qtttboard-demo.demozone.vn:5443/vala-report/desktop/
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon-256.png
  # Build từ Linux không có wine: bỏ bước gắn icon/thông tin phiên bản vào .exe.
  # Build trên Windows: pnpm build && npx electron-builder --win -c.win.signAndEditExecutable=true
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Vala Desktop
# Ubuntu: gói .deb (cài bằng quyền quản trị, kèm hồ sơ AppArmor để sandbox của Chromium chạy được trên Ubuntu 24.04+ —
# AppImage bị dừng ngay khi mở trên 24.04). Tự cập nhật qua latest-linux.yml; cài bản mới thì Ubuntu hỏi mật khẩu quản trị.
linux:
  target: [deb]
  executableName: vala-desktop
  artifactName: vala-desktop-${version}-linux-amd64.${ext}
  icon: resources/icon-256.png
  category: Office
  maintainer: Bkav
  synopsis: Vala Desktop
deb:
  afterInstall: packaging/deb-after-install.sh
  afterRemove: packaging/deb-after-remove.sh
