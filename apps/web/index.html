<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vala Reporting</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('vala.theme'); } catch (e) {}
        var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
      // Nhận diện của đơn vị (màu chủ đạo, tiêu đề) đã lưu từ lần trước — áp trước khi React chạy, khỏi nháy màu mặc định.
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('vala.branding') || 'null');
          if (!c) return;
          for (var k in c.vars) document.documentElement.style.setProperty(k, c.vars[k]);
          if (c.title) document.title = c.title;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
