server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;

    # Phân giải lại tên "api" qua DNS của Docker: container api được tạo lại (cập nhật code) thì đổi IP —
    # proxy_pass tên cố định sẽ giữ IP cũ và trả 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # API (cả tiện ích trình duyệt gọi qua đây). Crawlab gọi /api/v1/internal/* trực tiếp tới api, không qua nginx.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /healthz { proxy_pass $api_upstream; }

    # Tệp build có mã băm trong tên ⇒ lưu cache lâu; index.html thì không. Dùng expires (không add_header) để giữ header bảo mật ở trên.
    location /assets/ { expires 30d; }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
