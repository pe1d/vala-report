server {
    listen 80;
    server_name _;
    # __HTTPS_BASE__: PUBLIC_WEB_URL nếu là https://… (giữ đúng cổng, vd :5443), không thì https://$host.
    return 301 __HTTPS_BASE__$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;

    # Phân giải lại tên api mỗi 10 giây (container/pod api được tạo lại thì đổi IP — proxy_pass tên cố định sẽ giữ IP
    # cũ và trả 502). __RESOLVER__ / __API_UPSTREAM__ do entrypoint điền: DNS lấy từ /etc/resolv.conf (Docker: 127.0.0.11,
    # k3s: kube-dns); API_UPSTREAM mặc định http://api:3000 (Compose), trên k3s là tên đầy đủ của Service.
    resolver __RESOLVER__ valid=10s ipv6=off;
    set $api_upstream __API_UPSTREAM__;

    # API (cả tiện ích trình duyệt gọi qua đây). Crawlab gọi /api/v1/internal/* trực tiếp tới api, không qua nginx.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /healthz { proxy_pass $api_upstream; }

    # Bản cập nhật Vala Desktop (latest.yml + file cài *.exe, *.blockmap): chép vào thư mục được gắn ở đây — k3s:
    # /var/lib/vala-report/desktop trên máy chủ, Compose: deploy/desktop. latest.yml không được cache (ứng dụng hỏi nó để
    # biết có bản mới); file cài có số phiên bản trong tên nên cache bình thường.
    location /desktop/ {
        alias /usr/share/nginx/desktop/;
        autoindex off;
        location ~ \.yml$ { expires -1; }
    }
    # Tệp build có mã băm trong tên ⇒ lưu cache lâu; index.html thì không. Dùng expires (không add_header) để giữ header bảo mật ở trên.
    location /assets/ { expires 30d; }
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
