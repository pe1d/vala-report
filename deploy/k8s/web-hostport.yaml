# Web: giao diện + chuyển /api → api. Mở ra ngoài bằng hostPort (cluster không có Ingress, và cổng công khai 5443 nằm
# ngoài dải NodePort 30000–32767): https://<máy chủ>:5443 → nginx :443 trong pod. Chứng chỉ: Secret vala-tls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy: { type: Recreate }      # hostPort chỉ một pod giữ được — tắt bản cũ trước khi bật bản mới
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      annotations: { vala-report/config-hash: CONFIG_HASH }
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: vala-report-web:VALA_VERSION
          imagePullPolicy: Never
          env:
            # nginx không dùng search domain của pod ⇒ tên Service đầy đủ.
            - { name: API_UPSTREAM, value: "http://api.vala-report.svc.cluster.local:3000" }
            - name: PUBLIC_WEB_URL
              valueFrom: { secretKeyRef: { name: vala-env, key: PUBLIC_WEB_URL } }
          ports:
            - { name: https, containerPort: 443, hostPort: 5443 }
          readinessProbe:
            exec: { command: [wget, -q, -O, /dev/null, --no-check-certificate, "https://127.0.0.1/"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: certs, mountPath: /etc/nginx/certs, readOnly: true }
      volumes:
        - name: certs
          secret:
            secretName: vala-tls
            items:
              - { key: tls.crt, path: fullchain.pem }
              - { key: tls.key, path: privkey.pem }
