# Web chạy SAU Istio ingress gateway có sẵn của cluster (WEB_EXPOSE=istio trong .env.prod): gateway lo HTTPS bằng
# chứng chỉ của nó, pod web chỉ nghe HTTP :80, không giữ cổng nào trên máy chủ. Gắn đường dẫn vào VirtualService của
# tên miền bằng deploy/k8s/istio-route.sh (vd https://qtttboard-demo.demozone.vn:5443/vala-report → Service web:80).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      annotations: { vala-report/config-hash: CONFIG_HASH }
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: vala-report-web:VALA_VERSION
          imagePullPolicy: Never
          env:
            # nginx không dùng search domain của pod ⇒ tên Service đầy đủ.
            - { name: API_UPSTREAM, value: "http://api.vala-report.svc.cluster.local:3000" }
            - name: PUBLIC_WEB_URL
              valueFrom: { secretKeyRef: { name: vala-env, key: PUBLIC_WEB_URL } }
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            exec: { command: [wget, -q, -O, /dev/null, "http://127.0.0.1/"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: "1", memory: 256Mi }
